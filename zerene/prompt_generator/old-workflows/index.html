<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEO Prompt Generator</title>
<style>
  :root {
    --bg: #faf8f4;
    --surface: #ffffff;
    --text: #1d1b16;
    --muted: #6b665c;
    --border: #e6e1d6;
    --accent: #1f5f4a;
    --accent-text: #ffffff;
    --danger: #b3261e;
    --chip: #efeadf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14130f;
      --surface: #1d1b16;
      --text: #f1ede3;
      --muted: #a39d8f;
      --border: #33302a;
      --accent: #5cc3a0;
      --accent-text: #0e1a15;
      --danger: #f2a39d;
      --chip: #2a2720;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 56px 20px 80px; }
  .eyebrow { color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.1; margin: 10px 0 14px; letter-spacing: -.02em; }
  .lead { color: var(--muted); font-size: 18px; max-width: 620px; margin: 0 0 32px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 12px 14px; font-size: 16px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary {
    width: 100%; margin-top: 8px; padding: 14px 18px; font-size: 16px; font-weight: 600; font-family: inherit;
    background: var(--accent); color: var(--accent-text);
    border: 0; border-radius: 10px; cursor: pointer;
  }
  button.primary:disabled { opacity: .6; cursor: wait; }
  .status { margin-top: 16px; font-size: 15px; color: var(--muted); display: none; }
  .status.show { display: flex; align-items: center; gap: 10px; }
  .status.error { color: var(--danger); }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #results { margin-top: 36px; display: none; }
  #results h2 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
  .prompt { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
  .prompt p { margin: 0 0 10px; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); color: var(--muted); font-size: 12px; padding: 3px 9px; border-radius: 999px; }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button.secondary { padding: 10px 16px; font-size: 14px; font-family: inherit; font-weight: 600; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .card { padding: 20px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Generative Engine Optimization</div>
  <h1>See what buyers ask AI about your category</h1>
  <p class="lead">Enter your website and we will write 10 questions your buyers are likely to type into ChatGPT, Perplexity, Gemini and other AI engines.</p>

  <div class="card">
    <form id="geoForm" novalidate>
      <div class="grid">
        <div class="full">
          <label for="website_url">Website URL</label>
          <input id="website_url" name="website_url" type="text" inputmode="url" placeholder="https://yourbrand.com" required>
        </div>
        <div class="full">
          <label for="brand_name">Brand name <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
          <input id="brand_name" name="brand_name" type="text" placeholder="Your brand">
        </div>
        <div class="full">
          <label for="tier">Audience tier</label>
          <select id="tier" name="tier" required>
            <option>Tier 1: Executive &amp; VIP Corporate Gifting</option>
            <option>Tier 2: Hospitality, Majlis &amp; Boutique Hotel</option>
            <option>Tier 3: Healthcare, Spas &amp; Premium Medical Clinics</option>
            <option>Tier 4: Corporate Wellness &amp; Interior Architecture</option>
          </select>
        </div>
        <div>
          <label for="market">Market</label>
          <select id="market" name="market">
            <option>KSA</option><option>UAE</option><option>GCC</option><option>Global</option>
          </select>
        </div>
        <div>
          <label for="language">Language</label>
          <select id="language" name="language">
            <option>English</option><option>Arabic</option><option>English + Arabic</option>
          </select>
        </div>
      </div>
      <button class="primary" id="submitBtn" type="submit">Generate 10 prompts</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>
  </div>

  <section id="results">
    <h2>Your prompts</h2>
    <p class="sub" id="resultsSub"></p>
    <div id="list"></div>
    <div class="actions">
      <button class="secondary" id="copyBtn" type="button">Copy all prompts</button>
      <button class="secondary" id="csvBtn" type="button">Download CSV</button>
    </div>
  </section>
</div>

<script>
  // 1) Paste your n8n PRODUCTION webhook URL here (workflow must be Active).
  //    Use the /webhook-test/ URL only while testing with "Listen for test event".
  
  const WEBHOOK_URL = "https://n8n.srv1234249.hstgr.cloud/webhook/geo-prompts";

  const form = document.getElementById("geoForm");
  const btn = document.getElementById("submitBtn");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const listEl = document.getElementById("list");
  let current = [];

  function setStatus(msg, type) {
    statusEl.className = "status show" + (type === "error" ? " error" : "");
    statusEl.innerHTML = type === "loading" ? '<span class="spinner"></span><span></span>' : "<span></span>";
    statusEl.lastElementChild.textContent = msg;
  }

  function esc(s) {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function render(prompts) {
    current = prompts;
    listEl.innerHTML = prompts.map(p => `
      <div class="prompt">
        <p dir="auto">${esc(p.prompt_text)}</p>
        <div class="chips">
          <span class="chip">${esc(p.category)}</span>
          <span class="chip">${esc(p.keyword_intent)}</span>
          <span class="chip">${esc(p.icp_search_type)}</span>
          <span class="chip">${esc(p.market)}</span>
          <span class="chip">${esc(p.language)}</span>
          <span class="chip">${esc(p.segment)}</span>
        </div>
      </div>`).join("");
    document.getElementById("resultsSub").textContent =
      prompts.length + " prompts saved to your Google Sheet.";
    resultsEl.style.display = "block";
    resultsEl.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    data.website_url = (data.website_url || "").trim();

    if (!data.website_url || !/\./.test(data.website_url)) {
      setStatus("Please enter a valid website URL.", "error");
      return;
    }
    if (WEBHOOK_URL.includes("YOUR-N8N-DOMAIN")) {
      setStatus("Set your n8n webhook URL in the page script first.", "error");
      return;
    }

    btn.disabled = true;
    resultsEl.style.display = "none";
    setStatus("Reading your website and writing prompts. This takes about 30–60 seconds…", "loading");

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const json = await res.json();
      if (!json.prompts || !json.prompts.length) throw new Error("No prompts returned");
      statusEl.className = "status";
      render(json.prompts);
    } catch (err) {
      setStatus("Something went wrong: " + err.message + ". Please try again.", "error");
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById("copyBtn").addEventListener("click", async () => {
    const text = current.map((p, i) => (i + 1) + ". " + p.prompt_text).join("\n");
    try { await navigator.clipboard.writeText(text); setStatus("Copied to clipboard."); }
    catch { setStatus("Copy failed. Select the text manually.", "error"); }
  });

  document.getElementById("csvBtn").addEventListener("click", () => {
    if (!current.length) return;
    const cols = Object.keys(current[0]);
    const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
    const csv = [cols.join(",")].concat(current.map(r => cols.map(c => q(r[c])).join(","))).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = "geo-prompts.csv";
    a.click();
  });
</script>
</body>
</html>
